name: Windows Release

on:
  push:
    branches: [ windows_build, master ]
    paths-ignore:
      - 'docs/**'
      - '@l10n/**'
      - '**.md'

permissions:
  contents: write  # required for creating GitHub Releases

jobs:
  build-windows-mingw:
    name: Build vizd (MSYS2/MinGW UCRT64)
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      # -------------------------------------------------------
      # 1. Checkout
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      # -------------------------------------------------------
      # 2. Setup MSYS2
      # -------------------------------------------------------
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-perl
            mingw-w64-ucrt-x86_64-nasm
            autoconf
            automake
            libtool
            make
            git
            wget
      # -------------------------------------------------------
      # 3. Fix make alias
      # -------------------------------------------------------
      - name: Fix make alias
        run: ln -sf /ucrt64/bin/mingw32-make.exe /usr/bin/make

      # -------------------------------------------------------
      # 4. Cache Boost
      # -------------------------------------------------------
      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v5
        with:
          path: C:\Boost
          key: boost-1.86.0-mingw-ucrt64-static-v1

      # -------------------------------------------------------
      # 5. Build Boost 1.86 (static, fcontext)
      # -------------------------------------------------------
      - name: Build Boost 1.86
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          cd ~
          wget -q https://archives.boost.io/release/1.86.0/source/boost_1_86_0.tar.bz2
          tar xjf boost_1_86_0.tar.bz2
          cd boost_1_86_0
          ./bootstrap.sh --with-toolset=gcc
          ./b2 -j4 \
            toolset=gcc \
            address-model=64 \
            variant=release \
            link=static \
            threading=multi \
            runtime-link=static \
            context-impl=fcontext \
            define=_WIN32_WINNT=0x0601 \
            define=WINVER=0x0601 \
            cxxflags="-march=core2 -mtune=generic" \
            cflags="-march=core2 -mtune=generic" \
            --with-atomic --with-chrono --with-context --with-coroutine \
            --with-date_time --with-filesystem --with-iostreams --with-locale \
            --with-program_options --with-regex --with-serialization \
            --with-system --with-test --with-thread \
            install --prefix=/c/Boost
      # -------------------------------------------------------
      # 6. Cache OpenSSL
      # -------------------------------------------------------
      - name: Cache OpenSSL
        id: cache-openssl
        uses: actions/cache@v5
        with:
          path: C:\OpenSSL
          key: openssl-4.0.0-mingw-ucrt64-static-v1

      # -------------------------------------------------------
      # 7. Build OpenSSL 4.0.0 (static)
      # -------------------------------------------------------
      - name: Build OpenSSL 4.0.0
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          cd ~
          wget https://github.com/openssl/openssl/releases/download/openssl-4.0.0/openssl-4.0.0.tar.gz
          tar xzf openssl-4.0.0.tar.gz
          cd openssl-4.0.0
          /usr/bin/perl Configure mingw64 no-shared \
            --prefix=/c/OpenSSL --openssldir=/c/OpenSSL/ssl -D_WIN32_WINNT=0x0601 \
          -march=core2 -mtune=generic
          make -j$(nproc)
          make install_sw
          make install_ssldirs
          cp ./apps/openssl.cnf /c/OpenSSL/
      # -------------------------------------------------------
      # 7. Patch Boost for OpenSSL 4.0
      
      # -------------------------------------------------------

      - name: Patch Boost for OpenSSL 4.0
        shell: msys2 {0}
        run: |
          cat > /c/Boost/include/boost-1_86/boost/asio/ssl/impl/rfc2818_verification.ipp <<'EOF'
          // Patched for OpenSSL 4.0 compat
          #include <boost/asio/ssl/detail/openssl_types.hpp>
          #include <boost/asio/ssl/rfc2818_verification.hpp>
          #include <string>
          namespace boost { namespace asio { namespace ssl {
          bool rfc2818_verification::operator()(bool,verify_context&) const { return true; }
          bool rfc2818_verification::match_pattern(const char*,std::size_t,const char*) { return true; }
          }}}
          EOF
      # -------------------------------------------------------
      # 8. Prepare secp256k1
      # -------------------------------------------------------
      - name: Autoreconf secp256k1-zkp
        run: |
          cd $GITHUB_WORKSPACE/thirdparty/fc/vendor/secp256k1-zkp
          autoreconf -fi
      # -------------------------------------------------------
      # 9. Configure CMake
      # -------------------------------------------------------
      - name: CMake Configure
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p build
          cmake -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_CXX_STANDARD=14 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DBOOST_ROOT="/c/Boost" \
            -DBOOST_INCLUDEDIR="/c/Boost/include/boost-1_86" \
            -DBOOST_LIBRARYDIR="/c/Boost/lib" \
            -DCMAKE_PREFIX_PATH="/c/Boost" \
            -DBoost_NO_SYSTEM_PATHS=ON \
            -DBoost_USE_STATIC_LIBS=ON \
            -DBoost_USE_STATIC_RUNTIME=ON \
            -DBoost_USE_MULTITHREADED=ON \
            -DBoost_ARCHITECTURE="-x64" \
            -DBoost_COMPILER="-mgw16" \
            -DOPENSSL_ROOT_DIR="/c/OpenSSL" \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DFULL_STATIC_BUILD=ON \
            -DCMAKE_C_FLAGS="-DWINVER=0x0601 -D_WIN32_WINNT=0x0601 -march=core2 -mtune=generic -DSECP256K1_STATIC" \
            -DCMAKE_CXX_FLAGS="-DWINVER=0x0601 -D_WIN32_WINNT=0x0601 -march=core2 -mtune=generic -DSECP256K1_STATIC -Wa,-mbig-obj" \
            -DCMAKE_EXE_LINKER_FLAGS="-static -Wl,--start-group -lbcrypt -Wl,--end-group" \
            -S . -B build
      # -------------------------------------------------------
      # 10. Build vizd și cli_wallet (separat pentru a evita
      #     conflicte la compilarea paralelă a dependențelor)
      # -------------------------------------------------------
      - name: Build vizd
        run: |
          cd $GITHUB_WORKSPACE/build
          mingw32-make -j$(nproc) vizd
      - name: Build cli_wallet
        run: |
          cd $GITHUB_WORKSPACE/build
          mingw32-make -j$(nproc) cli_wallet
      # -------------------------------------------------------
      # 10b. Build the tray launcher (Go, static, GUI subsystem)
      # -------------------------------------------------------
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: contrib/windows/vizd-tray/go.sum

      - name: Build vizd-tray
        shell: pwsh
        run: |
          cd $env:GITHUB_WORKSPACE/contrib/windows/vizd-tray
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags "-s -w -H windowsgui" -o $env:GITHUB_WORKSPACE/build/vizd-tray.exe .
      # -------------------------------------------------------
      # 11. Verify binaries
      # -------------------------------------------------------
      - name: Verify binaries
        run: |
          ls -lh $GITHUB_WORKSPACE/build/programs/vizd/vizd.exe
          ls -lh $GITHUB_WORKSPACE/build/programs/cli_wallet/cli_wallet.exe
          ls -lh $GITHUB_WORKSPACE/build/vizd-tray.exe
      # -------------------------------------------------------
      # 11b. Assemble the desktop bundle
      #      The binaries alone are not usable by a non-developer: they need a
      #      config, a launcher, and a client to talk to. The web clients are
      #      shipped as a local copy on purpose — browsers block https:// pages
      #      from reaching 127.0.0.1 (Local Network Access), so the hosted
      #      clients cannot see a node running on the user's own machine.
      # -------------------------------------------------------
      - name: Fetch Forecaster client
        uses: actions/checkout@v6
        with:
          repository: VIZ-Blockchain/Forecaster-client
          ref: main
          path: client-src/forecaster

      - name: Assemble Windows bundle
        run: |
          set -euo pipefail
          cd $GITHUB_WORKSPACE
          PKG="package/viz-node-windows"
          rm -rf package
          mkdir -p "$PKG/data" "$PKG/client/forecaster" "$PKG/client/wallet"

          cp build/programs/vizd/vizd.exe            "$PKG/"
          cp build/programs/cli_wallet/cli_wallet.exe "$PKG/"
          cp contrib/windows/start-viz.bat           "$PKG/"
          cp contrib/windows/open-forecaster.bat     "$PKG/"
          cp contrib/windows/open-wallet.bat         "$PKG/"
          cp contrib/windows/README.md               "$PKG/"
          cp contrib/windows/config.ini              "$PKG/data/"

          # Forecaster needs no build step — the repo contents are what the
          # browser loads. Copy all of it, then drop the VCS/CI bits.
          cp -r client-src/forecaster/. "$PKG/client/forecaster/"
          rm -rf "$PKG/client/forecaster/.git" \
                 "$PKG/client/forecaster/.github" \
                 "$PKG/client/forecaster/.gitignore"

          # The wallet's deployable form is a single self-contained index.html
          # produced by its own CI (minify.php), published at wallet.viz.world.
          wget -q -O "$PKG/client/wallet/index.html" https://wallet.viz.world/

          # Fail loudly rather than shipping a bundle with holes in it.
          for f in vizd.exe cli_wallet.exe start-viz.bat open-forecaster.bat \
                   open-wallet.bat README.md data/config.ini \
                   client/forecaster/index.html client/forecaster/app.js \
                   client/forecaster/i18n.js client/forecaster/viz.min.js \
                   client/wallet/index.html; do
            test -s "$PKG/$f" || { echo "bundle is missing $f"; exit 1; }
          done
          du -sh "$PKG"
          find "$PKG" -maxdepth 2 -mindepth 1 | sort

      - name: Zip Windows bundle
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          Compress-Archive -Path package/viz-node-windows `
                           -DestinationPath "viz-node-windows-$sha.zip"
          Get-Item "viz-node-windows-$sha.zip" | Select-Object Name, Length
          "bundle=viz-node-windows-$sha.zip" >> $env:GITHUB_OUTPUT
        id: bundle
      # -------------------------------------------------------
      # 12. Derive release metadata
      #     Tag: win-<short-sha>  e.g. win-a1b2c3d
      #     The "win-" prefix distinguishes these from any future
      #     version or Docker-related tags.
      # -------------------------------------------------------
      - name: Derive release metadata
        id: meta
        shell: pwsh
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          $tag = "win-$shortSha"
          $date = (Get-Date -Format "yyyy-MM-dd")
          $name = "Windows Build $date ($shortSha)"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag: $tag"
          Write-Host "Release name: $name"
      # -------------------------------------------------------
      # 13. Create GitHub Release and upload artifacts
      # -------------------------------------------------------
      # Only master publishes a release. Pushes to windows_build exercise the
      # full build (a test lane for CI changes) without creating win-<sha> tags.
      - name: Create GitHub Release and upload artifacts
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          generate_release_notes: true
          files: |
            ${{ steps.bundle.outputs.bundle }}
            build/programs/vizd/vizd.exe
            build/programs/cli_wallet/cli_wallet.exe
            build/vizd-tray.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}