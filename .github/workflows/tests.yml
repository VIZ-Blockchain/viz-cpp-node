name: Tests

on:
  push:
    branches: [master]
  # No paths-ignore on purpose: this workflow provides required status checks on
  # master, and a check that is skipped because the PR only touched docs never
  # reports, leaving the PR blocked forever. A docs-only PR costs one matrix run;
  # public-repo minutes are free.
  pull_request:
  # Manual re-run on master at a chosen moment (post-fork acceptance, confirming a
  # flaky red). Without it the only ways to re-run this suite are an empty commit or
  # another merged PR -- and an empty commit does NOT wake the docker/windows
  # workflows, so it silently tested less than "everything".
  workflow_dispatch:

# A new push to a PR makes the previous run's result irrelevant; cancel it instead
# of letting a ~30 min run hold runners. Master pushes are never cancelled
# (group includes the unique run id there), so every merged commit is tested.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  consensus-and-pm:
    name: consensus_sim + pm unit tests (distro Boost)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 1G

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: P2P corruption recovery regression (offline)
        run: python3 tests/p2p/test_corruption_recovery.py -v

      - name: P2P reversible range regression (offline)
        run: python3 tests/p2p/test_reversible_range.py

      - name: P2P equal-height competing head regression (offline)
        run: python3 tests/p2p/test_equal_height_hello.py

      # Every field in FC_REFLECT travels to the snapshot file, but the importer is written
      # by hand; a field added to a struct and forgotten there is dropped silently on
      # restore. Runs first because it takes a second and needs no submodules.
      - name: Snapshot import coverage (offline)
        run: |
          set -euo pipefail
          python3 scripts/check_snapshot_import_coverage.py --selftest
          python3 scripts/check_snapshot_import_coverage.py

      - name: HF16 offline regression checks
        run: |
          set -euo pipefail
          python3 tests/p2p/test_slot_interval.py
          python3 tests/p2p/test_vote_ingress.py
          python3 tests/validator/test_signing_cache.py
          python3 tests/chain/test_snapshot_restore.py
          python3 tests/chain/test_hf9_schedule_guard.py
          python3 tests/chain/test_hf9_schedule_guard.py --selftest
          python3 tests/chain/test_snapshot_floor.py --selftest
          python3 tests/chain/test_snapshot_import_cause.py
          python3 tests/chain/test_snapshot_import_cause.py --selftest
          python3 tests/chain/test_snapshot_startup_guard.py --selftest
          python3 tests/chain/test_timeout_vote_journal.py
          python3 tests/chain/test_timeout_vote_journal.py --selftest
          python3 tests/chain/test_timeout_vote_persistence_wiring.py
          python3 tests/chain/test_timeout_vote_persistence_wiring.py --selftest
          python3 tests/chain/test_empty_schedule_slot.py
          python3 tests/chain/test_empty_schedule_slot.py --selftest
          # Windows Release runs only on pushes to master, so this Linux job is the
          # only place a windef.h macro used as an identifier can be caught pre-merge.
          python3 tests/chain/test_windows_macro_identifiers.py
          python3 tests/chain/test_windows_macro_identifiers.py --selftest
          python3 tests/chain/test_qc_gossip_wiring.py
          python3 tests/chain/test_qc_gossip_wiring.py --selftest
          python3 tests/chain/test_qc_vote_refresh.py
          python3 tests/chain/test_emergency_unstick_wiring.py
          python3 tests/chain/test_emergency_unstick_wiring.py --selftest
          python3 tests/chain/test_stall_recovery_wiring.py
          python3 tests/chain/test_stall_recovery_wiring.py --selftest
          python3 tests/chain/test_hf18_activation_skip_wiring.py
          python3 tests/chain/test_hf18_activation_skip_wiring.py --selftest
          python3 tests/chain/test_certified_sibling_wiring.py
          python3 tests/chain/test_certified_sibling_wiring.py --selftest
          python3 tests/chain/test_emergency_exit_wiring.py
          python3 tests/chain/test_emergency_exit_wiring.py --selftest
          python3 tests/chain/test_state_integrity_wiring.py
          python3 tests/chain/test_state_integrity_wiring.py --selftest
          python3 tests/chain/test_emergency_master_lib_gate.py
          python3 tests/chain/test_emergency_master_lib_gate.py --selftest
          python3 tests/chain/test_tc_skip_diagnosis_wiring.py
          python3 tests/chain/test_tc_skip_diagnosis_wiring.py --selftest
          # Guards the registry itself: a Python test in tests/ that no workflow invokes does not
          # run anywhere (CMake knows only the C++ suites) and fails nothing.
          # The image itself must answer "which commit am I": the label in the Dockerfiles
          # and the build-arg that feeds it are two halves that both fail silently alone.
          python3 tests/docker/test_image_lineage_labels.py
          python3 tests/docker/test_image_lineage_labels.py --selftest
          python3 scripts/check_offline_tests_registered.py
          python3 scripts/check_offline_tests_registered.py --selftest
          python3 tests/consensus_sim/production_safety_offline.py
          python3 scripts/hardfork_readiness.py --selftest
          node --test tests/block_log/archive_merge.test.cjs

      - name: Install build deps
        # Same guard as the other jobs: runners fetch packages from azure.archive.ubuntu.com,
        # and when that mirror goes quiet apt retries it until the job's 180-minute timeout
        # instead of failing (seen 2026-08-19; the guarded form had been added everywhere
        # except here, the one job that runs on every code PR and every master push).
        # 2026-11-19: same fix as the testnet arms below — ForceIPv4 (stalled attempts on a
        # dead IPv6 route showed up as `Ign:` lines 20-40 s apart) and only the Boost
        # components the build requests instead of the 154-package meta-package.
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list 2>/dev/null || true
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          $apt update
          $apt install -y --no-install-recommends \
            build-essential ccache cmake libssl-dev \
            libbz2-dev liblzma-dev libzstd-dev libreadline-dev \
            libtool ncurses-dev pkg-config zlib1g-dev
          $apt install -y --no-install-recommends \
            libboost-thread-dev libboost-date-time-dev libboost-filesystem-dev \
            libboost-program-options-dev libboost-serialization-dev libboost-chrono-dev \
            libboost-test-dev libboost-context-dev libboost-locale-dev libboost-coroutine-dev \
            libboost-iostreams-dev libboost-regex-dev \
            || $apt install -y --no-install-recommends libboost-all-dev

      # ccache >= 4 keeps its cache in ~/.cache/ccache, not ~/.ccache, so the old path
      # never existed and nothing was ever saved ("Path Validation Error"). Pin the
      # directory so the restore/save path and ccache agree.
      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: tests-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: tests-ccache-${{ runner.os }}-

      - name: Configure and build test targets
        run: |
          set -euo pipefail
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                -DBUILD_SHARED_LIBRARIES=FALSE \
                -DCHAINBASE_CHECK_LOCKING=FALSE \
                -DBUILD_CONSENSUS_TESTS=ON ..
          # Build exactly the binaries ctest will run, so a new add_test never shows up as "Not Run".
          # Discover the suites instead of naming them: a hardcoded list silently skipped
          # tests/node_admin and ctest reported its only test as "Not Run".
          TEST_CMAKE=$(find ../tests -mindepth 2 -maxdepth 2 -name CMakeLists.txt)
          TEST_BINS=$(grep -ho 'add_test(NAME [a-z_]* COMMAND [a-z_]*' $TEST_CMAKE | awk '{print $NF}')
          make -j"$(nproc)" $TEST_BINS
          ccache -s

      - name: Run tests
        env:
          # Pre-existing ASan/UBSan findings in chain code, see tests/consensus_sim/README.md
          ASAN_OPTIONS: new_delete_type_mismatch=0:detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=0:print_stacktrace=0
        run: |
          set -euo pipefail
          cd build
          ctest -E '^consensus_sim$' --output-on-failure
          # consensus_sim is one Boost.Test binary that ran ~15 min on a single core.
          # Run its cases as separate processes across all cores instead; same cases,
          # same working directory as ctest (failure logs land in the same place).
          cd tests/consensus_sim
          # --min-cases: floor of enabled cases in a non-testnet build. Raise it when adding
          # cases; a drop below it means a test file fell out of the build.
          python3 ../../../tests/consensus_sim/run_parallel.py ./consensus_sim_tests -j"$(nproc)" --min-cases 118

      - name: Upload consensus_sim failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: consensus-sim-failures
          # The harness writes failures/ under its working directory, which is the
          # BUILD tree (build/tests/consensus_sim); the source-tree dir only holds
          # .gitkeep, so the old path uploaded an empty artifact.
          path: build/tests/consensus_sim/failures/
          if-no-files-found: ignore

  # Mandatory on every code PR and master push: real two-signer BFT coverage
  # must not depend on a label. The N=1 arm also covers fork-gated PM scenarios.
  testnet_config:
    name: Testnet config + consensus_sim (${{ matrix.validators }} validators)
    strategy:
      fail-fast: false
      matrix:
        validators: [1, 2, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 1G

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install distro Boost and build deps
        # Runners fetch packages from azure.archive.ubuntu.com; when that mirror goes quiet
        # apt keeps retrying it and the job hangs for hours instead of failing (seen
        # 2026-08-19). Pin the canonical mirror, bound the wait, and cap the step.
        # 2026-11-19: the 15-minute cap was hit three times in a row on the same signature —
        # a stream of `Ign:` lines 20-40 s apart where the retry then succeeded. Two causes
        # are addressed here: stalled attempts usually mean a dead IPv6 route (ForceIPv4),
        # and `libboost-all-dev` pulls 154 packages / 94 MB, most of it OpenCL/HIP/MPI that
        # this build never links. Only the components CMakeLists actually requests are
        # installed, with the meta-package kept as a fallback if a component is ever renamed.
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list 2>/dev/null || true
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          $apt update
          $apt install -y --no-install-recommends \
            build-essential ccache cmake libssl-dev \
            libbz2-dev liblzma-dev libzstd-dev libreadline-dev \
            libtool ncurses-dev pkg-config zlib1g-dev
          # Mirrors the components the build actually requests: BOOST_COMPONENTS in CMakeLists.txt
          # (thread date_time filesystem program_options serialization chrono unit_test_framework
          # context locale coroutine), plus iostreams (thirdparty/fc) and regex (cli_wallet).
          $apt install -y --no-install-recommends \
            libboost-thread-dev libboost-date-time-dev libboost-filesystem-dev \
            libboost-program-options-dev libboost-serialization-dev libboost-chrono-dev \
            libboost-test-dev libboost-context-dev libboost-locale-dev libboost-coroutine-dev \
            libboost-iostreams-dev libboost-regex-dev \
            || $apt install -y --no-install-recommends libboost-all-dev

      # One cache per matrix arm: CHAIN_TESTNET_VALIDATORS changes compile flags.
      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: testnet-ccache-${{ runner.os }}-v${{ matrix.validators }}-${{ github.sha }}
          restore-keys: testnet-ccache-${{ runner.os }}-v${{ matrix.validators }}-

      - name: Configure and build the consensus simulator (testnet config)
        run: |
          set -euo pipefail
          mkdir -p build && cd build
          multi=()
          if [ "${{ matrix.validators }}" != "1" ]; then
            multi=(-DCHAIN_TESTNET_VALIDATORS=${{ matrix.validators }})
          fi
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                -DBUILD_SHARED_LIBRARIES=FALSE \
                -DCHAINBASE_CHECK_LOCKING=FALSE \
                -DBUILD_TESTNET=TRUE \
                -DBUILD_CONSENSUS_TESTS=ON "${multi[@]}" ..
          # chain_exit_threshold is header-only and needs no chain link, but it MUST be
          # built here: the exit threshold is the one place where a CHAIN_* literal changes
          # meaning between the production and the testnet config, and this job is the only
          # one that configures with -DBUILD_TESTNET. Building only consensus_sim_tests
          # would leave that build unverified (the ctest sweep in the other job uses the
          # production config).
          make -j"$(nproc)" consensus_sim_tests chain_exit_threshold_tests
          ccache -s

      - name: Run the exit-threshold test (testnet config)
        run: |
          set -euo pipefail
          cd build
          ctest -R '^chain_exit_threshold$' --output-on-failure

      - name: Run the simulator
        run: |
          set -euo pipefail
          cd build/tests/consensus_sim
          # --min-cases: floor of enabled cases in a testnet build (checked before --filter).
          run=(python3 ../../../tests/consensus_sim/run_parallel.py ./consensus_sim_tests -j"$(nproc)" --min-cases 176)
          if [ "${{ matrix.validators }}" = "2" ]; then
            "${run[@]}" --filter hf16_boundary_suite,hf16_production_safety_suite,validator_committed_state_suite,canonical_progress_suite,canonical_cache_lifecycle_suite
          elif [ "${{ matrix.validators }}" = "4" ]; then
            # legal_tc_progress_suite exists only in this arm; certified_sibling_switch_suite is built
            # in both the 4- and 21-validator arms, but this arm runs only named suites, so it must be
            # listed here or it would be built and never executed (the 21-validator arm runs all).
            "${run[@]}" --filter legal_tc_progress_suite,certified_sibling_switch_suite
          else
            "${run[@]}"
          fi
