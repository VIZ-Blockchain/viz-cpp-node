name: Tests

on:
  push:
    branches: [master]
  # No paths-ignore on purpose: this workflow provides required status checks on
  # master, and a check that is skipped because the PR only touched docs never
  # reports, leaving the PR blocked forever. A docs-only PR costs one matrix run;
  # public-repo minutes are free.
  pull_request:
  # Manual re-run on master at a chosen moment (post-fork acceptance, confirming a
  # flaky red). Without it the only ways to re-run this suite are an empty commit or
  # another merged PR -- and an empty commit does NOT wake the docker/windows
  # workflows, so it silently tested less than "everything".
  workflow_dispatch:

# A new push to a PR makes the previous run's result irrelevant; cancel it instead
# of letting a ~30 min run hold runners. Master pushes are never cancelled
# (group includes the unique run id there), so every merged commit is tested.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  consensus-and-pm:
    name: consensus_sim + pm unit tests (distro Boost)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 1G

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: P2P corruption recovery regression (offline)
        run: python3 tests/p2p/test_corruption_recovery.py -v

      # Every field in FC_REFLECT travels to the snapshot file, but the importer is written
      # by hand; a field added to a struct and forgotten there is dropped silently on
      # restore. Runs first because it takes a second and needs no submodules.
      - name: Snapshot import coverage (offline)
        run: |
          set -euo pipefail
          python3 scripts/check_snapshot_import_coverage.py --selftest
          python3 scripts/check_snapshot_import_coverage.py

      - name: HF16 offline regression checks
        run: |
          set -euo pipefail
          python3 tests/p2p/test_slot_interval.py
          python3 tests/p2p/test_vote_ingress.py
          python3 tests/validator/test_signing_cache.py
          python3 tests/chain/test_snapshot_restore.py
          python3 tests/chain/test_hf9_schedule_guard.py
          python3 tests/chain/test_hf9_schedule_guard.py --selftest
          python3 tests/chain/test_snapshot_floor.py --selftest
          python3 tests/chain/test_snapshot_startup_guard.py --selftest
          python3 tests/chain/test_timeout_vote_journal.py
          python3 tests/chain/test_timeout_vote_journal.py --selftest
          python3 tests/chain/test_timeout_vote_persistence_wiring.py
          python3 tests/chain/test_timeout_vote_persistence_wiring.py --selftest
          python3 tests/consensus_sim/production_safety_offline.py
          python3 scripts/hardfork_readiness.py --selftest
          node --test tests/block_log/archive_merge.test.cjs

      - name: Install build deps
        # Same guard as the other jobs: runners fetch packages from azure.archive.ubuntu.com,
        # and when that mirror goes quiet apt retries it until the job's 180-minute timeout
        # instead of failing (seen 2026-08-19; the guarded form had been added everywhere
        # except here, the one job that runs on every code PR and every master push).
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list 2>/dev/null || true
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          $apt update
          $apt install -y --no-install-recommends \
            build-essential ccache cmake libboost-all-dev libssl-dev \
            libbz2-dev liblzma-dev libzstd-dev libreadline-dev \
            libtool ncurses-dev pkg-config zlib1g-dev

      # ccache >= 4 keeps its cache in ~/.cache/ccache, not ~/.ccache, so the old path
      # never existed and nothing was ever saved ("Path Validation Error"). Pin the
      # directory so the restore/save path and ccache agree.
      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: tests-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: tests-ccache-${{ runner.os }}-

      - name: Configure and build test targets
        run: |
          set -euo pipefail
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                -DBUILD_SHARED_LIBRARIES=FALSE \
                -DCHAINBASE_CHECK_LOCKING=FALSE \
                -DBUILD_CONSENSUS_TESTS=ON ..
          # Build exactly the binaries ctest will run, so a new add_test never shows up as "Not Run".
          # Discover the suites instead of naming them: a hardcoded list silently skipped
          # tests/node_admin and ctest reported its only test as "Not Run".
          TEST_CMAKE=$(find ../tests -mindepth 2 -maxdepth 2 -name CMakeLists.txt)
          TEST_BINS=$(grep -ho 'add_test(NAME [a-z_]* COMMAND [a-z_]*' $TEST_CMAKE | awk '{print $NF}')
          make -j"$(nproc)" $TEST_BINS
          ccache -s

      - name: Run tests
        env:
          # Pre-existing ASan/UBSan findings in chain code, see tests/consensus_sim/README.md
          ASAN_OPTIONS: new_delete_type_mismatch=0:detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=0:print_stacktrace=0
        run: |
          set -euo pipefail
          cd build
          ctest -E '^consensus_sim$' --output-on-failure
          # consensus_sim is one Boost.Test binary that ran ~15 min on a single core.
          # Run its cases as separate processes across all cores instead; same cases,
          # same working directory as ctest (failure logs land in the same place).
          cd tests/consensus_sim
          # --min-cases: floor of enabled cases in a non-testnet build. Raise it when adding
          # cases; a drop below it means a test file fell out of the build.
          python3 ../../../tests/consensus_sim/run_parallel.py ./consensus_sim_tests -j"$(nproc)" --min-cases 118

      - name: Upload consensus_sim failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: consensus-sim-failures
          # The harness writes failures/ under its working directory, which is the
          # BUILD tree (build/tests/consensus_sim); the source-tree dir only holds
          # .gitkeep, so the old path uploaded an empty artifact.
          path: build/tests/consensus_sim/failures/
          if-no-files-found: ignore

  # Mandatory on every code PR and master push: real two-signer BFT coverage
  # must not depend on a label. The N=1 arm also covers fork-gated PM scenarios.
  testnet_config:
    name: Testnet config + consensus_sim (${{ matrix.validators }} validators)
    strategy:
      fail-fast: false
      matrix:
        validators: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 1G

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install distro Boost and build deps
        # Runners fetch packages from azure.archive.ubuntu.com; when that mirror goes quiet
        # apt keeps retrying it and the job hangs for hours instead of failing (seen
        # 2026-08-19). Pin the canonical mirror, bound the wait, and cap the step.
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list 2>/dev/null || true
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          $apt update
          $apt install -y --no-install-recommends \
            build-essential ccache cmake libboost-all-dev libssl-dev \
            libbz2-dev liblzma-dev libzstd-dev libreadline-dev \
            libtool ncurses-dev pkg-config zlib1g-dev

      # One cache per matrix arm: CHAIN_TESTNET_VALIDATORS changes compile flags.
      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: testnet-ccache-${{ runner.os }}-v${{ matrix.validators }}-${{ github.sha }}
          restore-keys: testnet-ccache-${{ runner.os }}-v${{ matrix.validators }}-

      - name: Configure and build the consensus simulator (testnet config)
        run: |
          set -euo pipefail
          mkdir -p build && cd build
          multi=()
          if [ "${{ matrix.validators }}" = "2" ]; then
            multi=(-DCHAIN_TESTNET_VALIDATORS=2)
          fi
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
                -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                -DBUILD_SHARED_LIBRARIES=FALSE \
                -DCHAINBASE_CHECK_LOCKING=FALSE \
                -DBUILD_TESTNET=TRUE \
                -DBUILD_CONSENSUS_TESTS=ON "${multi[@]}" ..
          make -j"$(nproc)" consensus_sim_tests
          ccache -s

      - name: Run the simulator
        run: |
          set -euo pipefail
          cd build/tests/consensus_sim
          # --min-cases: floor of enabled cases in a testnet build (checked before --filter).
          run=(python3 ../../../tests/consensus_sim/run_parallel.py ./consensus_sim_tests -j"$(nproc)" --min-cases 174)
          if [ "${{ matrix.validators }}" = "2" ]; then
            "${run[@]}" --filter hf16_boundary_suite,hf16_production_safety_suite,validator_committed_state_suite
          else
            "${run[@]}"
          fi
