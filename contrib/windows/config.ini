# VIZ node — configuration for a personal (desktop) node on Windows.
#
# Goal: run your own mainnet node and point Forecaster / VIZ Wallet at it, so you
# do not depend on anyone else's RPC. The node bootstraps from a snapshot served by
# trusted peers instead of replaying the whole chain.
#
# Paths here are relative to the data directory (the folder holding this file).

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------

# P2P listener. A home machine behind NAT will not receive incoming connections;
# outgoing ones work regardless, so this port does not need to be forwarded.
p2p-endpoint = 0.0.0.0:2001

# Peers to connect to on startup. Hostnames, not raw IPs — an IP cannot be re-pointed.
p2p-seed-node = seed3.viz.world:2001 # canonical tip
p2p-seed-node = seed1.viz.world:2001
p2p-seed-node = rpc.viz.cx:2001

# Recover automatically if the node wedges below LIB (can happen after an unclean
# shutdown — closing the laptop lid mid-write, power loss). Off by default upstream
# because operators want to inspect a wedge; for an unattended desktop node,
# self-healing is the better trade.
auto-resync-on-wedge = true

# ---------------------------------------------------------------------------
# RPC for local clients — LOCALHOST ONLY
# ---------------------------------------------------------------------------
# Do not change 127.0.0.1 to 0.0.0.0 unless you intend to expose the node to your
# network: the API has no authentication, and the node answers CORS to any origin
# (that is what lets the web clients talk to it).

webserver-http-endpoint = 127.0.0.1:8090
webserver-ws-endpoint = 127.0.0.1:8091
webserver-thread-pool-size = 2
single-write-thread = true
enable-plugins-on-push-transaction = false

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------
# Everything the wallet and Forecaster need, and nothing that bloats state.

plugin = chain p2p
plugin = json_rpc webserver
plugin = database_api network_broadcast_api
plugin = account_by_key
plugin = committee_api invite_api validator_api paid_subscription_api custom_protocol_api
plugin = snapshot

# Prediction markets (Forecaster). Available from the HF14 release onwards — an
# unknown plugin name aborts startup, so keep this line commented out if your
# vizd.exe predates HF14.
plugin = prediction_market_api

# Operation history is NOT enabled: it stores every operation of every account and
# is by far the largest part of the state. Enable the two lines below only if you
# want the wallet's "operation history" screens served by your own node — expect a
# much larger shared_memory.bin and a slower first sync.
# plugin = operation_history
# plugin = account_history
# history-count-blocks = 57600

# ---------------------------------------------------------------------------
# Snapshot bootstrap (this is what makes the first start take minutes, not days)
# ---------------------------------------------------------------------------

sync-snapshot-from-trusted-peer = true
trusted-snapshot-peer = seed3.viz.world:8092 # canonical tip
trusted-snapshot-peer = seed1.viz.world:8092
trusted-snapshot-peer = seed2.viz.world:8092
trusted-snapshot-peer = rpc.viz.cx:8092

snapshot-dir = snapshots

# A personal node consumes snapshots, it does not serve them.
allow-snapshot-serving = false

# Writing your own snapshots is optional. Uncomment to keep a local restore point
# (costs disk, but lets you recover without downloading again).
# snapshot-every-n-blocks = 28800
# snapshot-max-age-days = 7

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------
# shared_memory.bin starts at this size and grows automatically as needed.
shared-file-size = 2G
min-free-shared-file-size = 500M
inc-shared-file-size = 2G
block-num-check-free-size = 1000

# Keep only a recent window of raw blocks on disk.
dlt-block-log-max-blocks = 100000

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

[log.console_appender.stderr]
stream=std_error

[logger.default]
level=info
appenders=stderr

[logger.p2p]
level=error
appenders=stderr
